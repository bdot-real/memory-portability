[project]
name = "ompm"
version = "0.1.0"
description = "Ontology-mediated memory portability across LLM engines: prototype and fidelity benchmark"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
    "pyoxigraph>=0.4",
    "jsonschema>=4.23",
    "mcp>=1.2",
    "anthropic>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ompm"]

[tool.ruff]
line-length = 100
